# =============================================================================
# Axpert Multi-Inverter Monitor — Main Configuration
#
# This file is the DEFAULT TEMPLATE copied on first startup.
# Edit /app/config/app_config.conf to match your installation.
#
# Changes to this file are applied automatically without restarting.
# =============================================================================

[system]
# Number of active inverters (1 to 9)
num_inverters = 1

# How often each inverter is queried (ms, min 100). Inverters are queried in
# parallel, each on its own TCP converter; the web UI updates at this rate.
delay_between_inverters_ms = 1000

# How often energy is accumulated and totals are published to MQTT
# (ms, min 1000). Energy counters are written to disk once a minute.
delay_between_cycles_ms = 5000

# Inverter DC→AC efficiency (%, 50-100), used to estimate grid input power.
# 100 ignores conversion losses; typical Axpert values are 90-95.
inverter_efficiency_percent = 100

# Log level: trace | debug | info | warn | error
log_level = "info"

# =============================================================================
[battery]
# Nominal capacity of the battery bank (Ah)
capacity_ah = 100.0

# Safety margin: SOC (%) kept in reserve. Battery time remaining is the time
# until the SOC reaches this value at the current discharge.
safety_margin_percent = 20.0

# CO2 emission factor for grid electricity (kg per kWh)
# Spain average: 0.233  |  EU average: 0.276  |  USA average: 0.386
co2_factor_kg_per_kwh = 0.233

# =============================================================================
[mqtt]
# IP address of your MQTT broker (e.g. Home Assistant host)
broker_ip = "192.168.1.100"
broker_port = 1883

# Broker credentials — placeholders, replace with your own.
# Set both to "" if the broker has no authentication.
user = "user"
password = "password"

# Base topic prefix for sensor states
# Sensors will be published as: {topic_prefix}/inv01/battery_voltage
topic_prefix = "axpert"

# Home Assistant MQTT discovery prefix (usually "homeassistant")
ha_discovery_prefix = "homeassistant"

# =============================================================================
[web]
# Port for the web monitoring interface (must match EXPOSE in Dockerfile)
port = 60606

# Session timeout in seconds (default 1 hour)
session_timeout_seconds = 3600

# =============================================================================
# Inverter definitions — add one [[inverters]] block per inverter
# id must be unique (1-9)
# tcp_ip: IP address of the inverter's TCP-to-serial adapter
# tcp_port: TCP port (Voltronic default is usually 8899 or 26)
# =============================================================================

[[inverters]]
id = 1
name = "Inverter 1"
tcp_ip = "192.168.1.200"
tcp_port = 8899
ha_device_name = "Axpert Inverter 1"
enabled = true

# Uncomment and adjust to add more inverters:
# [[inverters]]
# id = 2
# name = "Inverter 2"
# tcp_ip = "192.168.1.201"
# tcp_port = 8899
# ha_device_name = "Axpert Inverter 2"
# enabled = true
