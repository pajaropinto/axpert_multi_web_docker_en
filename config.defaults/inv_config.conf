# =============================================================================
# Inverter Configuration Parameters — Default Template
#
# This file is copied automatically for each inverter on first startup.
# Load and save these values from the Web UI (per-inverter Config tab).
# Edit manually with care — values must match inverter command syntax.
# =============================================================================

[params]
# Output source priority: 00=Utility first, 01=Solar first, 02=SBU (Solar>Battery>Utility)
source_priority = "01"

# AC input voltage range: 00=Appliance (wide ±15%), 01=UPS (narrow ±10%)
ac_input_range = "00"

# Output frequency (Hz): 50 | 60
output_frequency = "50"

# Maximum total charging current (A): 10, 20, 30, 40, 50, 60, 80, 100...
max_charger_current = "40"

# Charger source priority: 00=Solar first, 01=Solar+Utility, 02=Only solar
charger_priority = "00"

# Maximum battery discharge current (A)
max_discharge_current = "100"

# Restart after overload: PEU=Enable, PDU=Disable
overload_restart = "PDU"

# Restart after over-temperature: PEV=Enable, PDV=Disable
overtemp_restart = "PDV"

# Buzzer alarm: PEA=Enable, PDA=Disable
buzzer = "PDA"

# Auto-return to main screen: PEK=Enable, PDK=Disable
lcd_escape = "PEK"

# LCD backlight: PEX=Enable, PDX=Disable
backlight = "PEX"

# Grid loss alarm: PEY=Enable, PDY=Disable
grid_loss_alarm = "PDY"

# Bypass output when overload: PEB=Enable, PDB=Disable
overload_bypass = "PDB"

# Record fault codes: PEZ=Enable, PDZ=Disable
fault_logging = "PEZ"

# Battery equalization: 0=Disable, 1=Enable
equalization = "0"
